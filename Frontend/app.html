<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HVAC Connect</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/design-system.css" />
</head>
<body class="app-view">
    <!-- Everything inside .app so the CSS grid works -->
    <div class="app">

        <!-- Top bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <a href="#" class="brand">HVAC<span>CONNECT</span></a>
            </div>
            <div class="top-actions">
                <div class="user-profile-menu">
                    <div class="user-chip">
                        <div class="avatar" id="userAvatar">SR</div>
                        <div class="user-meta">
                            <b id="currentUserName">Loading…</b>
                            <small id="currentUserRole"></small>
                        </div>
                    </div>
                </div>
                <button id="logoutBtn" class="btn small">Logout</button>
            </div>
        </header>

        <!-- Sidebar navigation -->
        <aside id="sidebar" class="sidebar"></aside>

        <!-- Main content area -->
        <section class="main">
            <div id="pageContent"></div>
        </section>

    </div>

    <!-- Toast & Modal containers -->
    <div id="toastContainer" class="toast-container"></div>
    <div id="modalContainer" class="modal-container" style="display:none;"></div>

    <!-- Core scripts -->
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <!-- Page modules (must load before app.js so window.Pages is populated) -->
    <script src="pages/superadmin-dashboard.js"></script>
    <script src="pages/vendor-dashboard.js"></script>
    <script src="pages/coordinator-dashboard.js"></script>
    <script src="pages/technician-dashboard.js"></script>
    <script src="pages/enduser-dashboard.js"></script>
    <script src="pages/vendors.js"></script>
    <script src="pages/customers.js"></script>
    <script src="pages/locations.js"></script>
    <script src="pages/assets.js"></script>
    <script src="pages/technicians.js"></script>
    <script src="pages/tickets.js"></script>
    <script src="pages/ticket-detail.js"></script>
    <script src="pages/imports.js"></script>
    <script src="pages/duplicates.js"></script>
    <script src="pages/onboarding.js"></script>
    <script src="pages/audit.js"></script>
    <script src="pages/error-pages.js"></script>
    <script src="pages/asset-detail.js"></script>
    <!-- App core (runs after pages are registered) -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            App.init();
        });
    </script>
</body>
</html>
